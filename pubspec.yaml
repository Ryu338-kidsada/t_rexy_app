name: trexy_app
description: "T-REXY - แอพศึกษาไดโนเสาร์"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # State management
  provider: ^6.1.2
  model_viewer_plus: ^1.10.0
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/images/demo/
    - assets/images/videos/
    - assets/images/museums/
    - assets/images/contact_icons/
    - assets/images/dino/dinosaur_model/
    - assets/audio/

  # เปิดใช้เมื่อได้รูปจาก Figma แล้ว
  # assets:
  #   - assets/images/
